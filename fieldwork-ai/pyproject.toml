[project]
name = "fieldwork-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.11.0",
    "google-cloud-firestore>=2.34.0",
    "google-cloud-storage>=3.16.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6,<1",
    "joblib>=1.6.0",
    "mcp>=2.3.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=4.10,<5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=4.50",
    "truststore>=0.10.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
fieldwork-ai = "fieldwork_ai:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
